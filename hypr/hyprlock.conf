# Конфигурация Hyprlock под красно-черные обои

background {
    monitor =
    # Укажите АБСОЛЮТНЫЙ путь к вашим обоям
    path = /home/ВАШЕ_ИМЯ_ПОЛЬЗОВАТЕЛЯ/Pictures/wallpaper.jpg
    
    # Эффект сильного стильного размытия для читаемости текста
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.2
}

# Поле ввода пароля
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.25 # Размер точек пароля
    dots_spacing = 0.40 
    dots_center = true

    # Цветовая схема на основе палитры обоев
    outer_color = rgb(161, 51, 20)      # Приглушенный красный (рамка)
    inner_color = rgb(26, 26, 26)       # Угольно-черный фон поля
    font_color = rgb(217, 210, 201)     # Песочно-бежевый цвет точек
    
    # Эффект при успешном / ошибочном вводе
    check_color = rgb(230, 74, 25)      # Яркий оранжевый при проверке
    fail_color = rgb(255, 0, 0)         # Красный при ошибке
    
    fade_on_empty = false
    placeholder_text = <i>Введите пароль...</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# Часы (крупный аккуратный текст)
label {
    monitor =
    text = $TIME
    color = rgb(217, 210, 201)          # Мягкий бежевый цвет из левого угла обоев
    font_size = 80
    font_family = JetBrains Mono Nerd Font Big
    position = 0, 120
    halign = center
    valign = center
}

# Приветственная надпись
label {
    monitor =
    text = Привет, $USER
    color = rgb(230, 74, 25)            # Акцентный красно-оранжевый
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
